[workspace]
resolver = "2"
members = [
    "crates/bm-types",
    "crates/bm-domain",
    "crates/bm-infra",
    "crates/bm-api",
    "crates/bm-gateway",
    "crates/bm-app",
    "crates/bm-worker",
]
default-members = [
    "crates/bm-gateway",
    "crates/bm-app",
    "crates/bm-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
authors = ["Big Market Rust Track"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
figment = { version = "0.10", features = ["env", "toml"] }
fred = { version = "9", default-features = false, features = ["enable-rustls", "subscriber-client"] }
futures = "0.3"
hex = "0.4"
jsonwebtoken = "9"
lapin = "2"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "chrono", "rust_decimal", "migrate"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
tokio-cron-scheduler = "0.13"
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = ["trace", "cors", "timeout", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
rust_decimal = { version = "1", features = ["serde"] }
bm-types = { path = "crates/bm-types" }
bm-domain = { path = "crates/bm-domain" }
bm-infra = { path = "crates/bm-infra" }
bm-api = { path = "crates/bm-api" }

[profile.release]
lto = "thin"
codegen-units = 1
