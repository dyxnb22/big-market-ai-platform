# Local development: downstream services on localhost.
spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/*/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-cb
                fallbackUri: forward:/fallback/auth-service
        - id: admin-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/*/admin/**
          filters:
            - name: CircuitBreaker
              args:
                name: admin-cb
                fallbackUri: forward:/fallback/admin-service
        - id: chatbot-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/*/chatbot/**
          filters:
            - name: CircuitBreaker
              args:
                name: chatbot-cb
                fallbackUri: forward:/fallback/chatbot-service
        - id: market-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/**
          filters:
            - name: CircuitBreaker
              args:
                name: market-cb
                fallbackUri: forward:/fallback/market-service

server:
  port: 8080
