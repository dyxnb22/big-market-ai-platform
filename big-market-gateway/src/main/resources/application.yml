spring:
  config:
    name: big-market-gateway
  profiles:
    active: dev
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

logging:
  config: classpath:logback-spring.xml

# ── 限流器默认配置（内存令牌桶） ──
# 开发环境基本不限制；生产/Docker 环境通过环境变量或 Profile 覆盖为更严格的配置。
gateway:
  rate-limiter:
    enabled: ${GATEWAY_RATE_LIMITER_ENABLED:false}
    replenish-rate: ${GATEWAY_RATE_LIMITER_REPLENISH:100}
    burst-capacity: ${GATEWAY_RATE_LIMITER_BURST:200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,prometheus
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
    instances:
      auth-cb:
        base-config: default
      admin-cb:
        base-config: default
      chatbot-cb:
        base-config: default
      market-cb:
        base-config: default
