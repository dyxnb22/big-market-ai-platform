spring:
  config:
    name: big-market-gateway
  profiles:
    active: dev
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

logging:
  config: classpath:logback-spring.xml

# ── Rate limiter defaults (in-memory token bucket) ──
# Dev: effectively open. Prod/docker: tighten via env or profile override.
gateway:
  rate-limiter:
    enabled: ${GATEWAY_RATE_LIMITER_ENABLED:false}
    replenish-rate: ${GATEWAY_RATE_LIMITER_REPLENISH:100}
    burst-capacity: ${GATEWAY_RATE_LIMITER_BURST:200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  endpoint:
    health:
      show-details: when_authorized

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
    instances:
      auth-cb:
        base-config: default
      admin-cb:
        base-config: default
      chatbot-cb:
        base-config: default
      market-cb:
        base-config: default
