spring:
  config:
    name: big-market-gateway
  profiles:
    active: dev

logging:
  config: classpath:logback-spring.xml

# ── Rate limiter defaults (in-memory token bucket) ──
# Dev: effectively open. Prod/docker: tighten via env or profile override.
gateway:
  rate-limiter:
    enabled: ${GATEWAY_RATE_LIMITER_ENABLED:false}
    replenish-rate: ${GATEWAY_RATE_LIMITER_REPLENISH:100}
    burst-capacity: ${GATEWAY_RATE_LIMITER_BURST:200}

---
spring:
  config:
    activate:
      on-profile: dev
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/*/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-cb
                fallbackUri: forward:/fallback/auth-service
        - id: admin-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/*/admin/**
          filters:
            - name: CircuitBreaker
              args:
                name: admin-cb
                fallbackUri: forward:/fallback/admin-service
        - id: chatbot-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/*/chatbot/**
          filters:
            - name: CircuitBreaker
              args:
                name: chatbot-cb
                fallbackUri: forward:/fallback/chatbot-service
        - id: market-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/**
          filters:
            - name: CircuitBreaker
              args:
                name: market-cb
                fallbackUri: forward:/fallback/market-service

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  endpoint:
    health:
      show-details: always

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
    instances:
      auth-cb:
        base-config: default
      admin-cb:
        base-config: default
      chatbot-cb:
        base-config: default
      market-cb:
        base-config: default

---
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:big-market-auth-service}:${AUTH_SERVICE_PORT:8081}
          predicates:
            - Path=/api/*/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-cb
                fallbackUri: forward:/fallback/auth-service
            - name: IpPathRateLimit
              args:
                replenishRate: ${GATEWAY_RATE_LIMITER_REPLENISH:20}
                burstCapacity: ${GATEWAY_RATE_LIMITER_BURST:40}
        - id: admin-service
          uri: http://${ADMIN_SERVICE_HOST:big-market-admin-service}:${ADMIN_SERVICE_PORT:8082}
          predicates:
            - Path=/api/*/admin/**
          filters:
            - name: CircuitBreaker
              args:
                name: admin-cb
                fallbackUri: forward:/fallback/admin-service
        - id: chatbot-service
          uri: http://${CHATBOT_SERVICE_HOST:big-market-chatbot-service}:${CHATBOT_SERVICE_PORT:8084}
          predicates:
            - Path=/api/*/chatbot/**
          filters:
            - name: CircuitBreaker
              args:
                name: chatbot-cb
                fallbackUri: forward:/fallback/chatbot-service
        - id: market-service
          uri: http://${MARKET_SERVICE_HOST:big-market-market-service}:${MARKET_SERVICE_PORT:8083}
          predicates:
            - Path=/api/**
          filters:
            - name: CircuitBreaker
              args:
                name: market-cb
                fallbackUri: forward:/fallback/market-service
            - name: IpPathRateLimit
              args:
                replenishRate: ${GATEWAY_RATE_LIMITER_REPLENISH:20}
                burstCapacity: ${GATEWAY_RATE_LIMITER_BURST:40}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  endpoint:
    health:
      show-details: always

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
    instances:
      auth-cb:
        base-config: default
      admin-cb:
        base-config: default
      chatbot-cb:
        base-config: default
      market-cb:
        base-config: default
