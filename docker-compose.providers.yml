# Optional provider services overlay.
#
# Use together with docker-compose.yml when you need dedicated provider
# processes for fulfillment/rebate/strategy in local learning experiments.
#
# Example (the helper also recreates the affected consumers):
#   ./scripts/start-provider-mode.sh fulfillment
#   ./scripts/start-provider-mode.sh rebate-strategy
#   ./scripts/start-provider-mode.sh all
#
# Secure mode requires the variables documented in docker-compose.secure.yml:
#   ./scripts/start-provider-mode.sh --secure fulfillment
#
# Do not start these services by hand after the default stack is already running:
# the market/message-job consumers must be recreated with the matching remote-mode
# flags. Use scripts/start-provider-mode.sh so the switch is atomic at the compose
# level.
#
# Default learning/acceptance topology does not include these services.

services:
  big-market-fulfillment-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE_NAME: big-market-fulfillment-service
    image: big-market-fulfillment-service:latest
    container_name: big-market-fulfillment-service
    restart: "no"
    ports:
      - "8087:8087"
    environment:
      - SERVER_PORT=8087
      - SPRING_PROFILES_ACTIVE=docker
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASS=${MYSQL_ROOT_PASSWORD:-123456}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-admin}
      - DUBBO_REGISTRY_ADDRESS=nacos://nacos:8848
      - ACCOUNT_AWARD_CREDIT_OUTBOX_ENABLED=${ACCOUNT_AWARD_CREDIT_OUTBOX_ENABLED:-true}
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - GATEWAY_API_HOST=big-market-gateway
    networks:
      - dev-ops_my-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8087/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  big-market-rebate-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE_NAME: big-market-rebate-service
    image: big-market-rebate-service:latest
    container_name: big-market-rebate-service
    restart: "no"
    ports:
      - "8088:8088"
    environment:
      - SERVER_PORT=8088
      - SPRING_PROFILES_ACTIVE=docker
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASS=${MYSQL_ROOT_PASSWORD:-123456}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-admin}
      - DUBBO_REGISTRY_ADDRESS=nacos://nacos:8848
    networks:
      - dev-ops_my-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  big-market-strategy-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE_NAME: big-market-strategy-service
    image: big-market-strategy-service:latest
    container_name: big-market-strategy-service
    restart: "no"
    ports:
      - "8089:8089"
    environment:
      - SERVER_PORT=8089
      - SPRING_PROFILES_ACTIVE=docker
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASS=${MYSQL_ROOT_PASSWORD:-123456}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DUBBO_REGISTRY_ADDRESS=nacos://nacos:8848
    networks:
      - dev-ops_my-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8089/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

networks:
  dev-ops_my-network:
    external: true
