server:
  port: ${SERVER_PORT:8083}
  tomcat:
    mbeanregistry:
      enabled: true
    max-connections: 200
    threads:
      max: 150
      min-spare: 50
    accept-count: 10

app:
  config:
    api-version: ${API_VERSION:v1}
    cross-origin: ${CROSS_ORIGIN:'*'}
  jwt:
    secret: ${JWT_SECRET:change-me-in-dev-only}
  admin:
    token: ${ADMIN_TOKEN:admin-dev-token}
    user-ids: ${ADMIN_USER_IDS:admin}
  internal-rpc:
    token: ${APP_INTERNAL_RPC_TOKEN:big-market-internal-dev}
    enforce: ${APP_INTERNAL_RPC_ENFORCE:false}

spring:
  profiles:
    active: dev
  cloud:
    zookeeper:
      enabled: false
  rabbitmq:
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASS:admin}
    listener:
      simple:
        prefetch: 1
        default-requeue-rejected: false
    topic:
      activity_sku_stock_zero: activity_sku_stock_zero
      send_award: send_award
      send_rebate: send_rebate
      credit_adjust_success: credit_adjust_success
  elasticsearch.datasource:
    driverClassName: org.elasticsearch.xpack.sql.jdbc.EsDriver

thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

mini-db-router:
  jdbc:
    datasource:
      dbCount: 2
      tbCount: 4
      default: db00
      routerKey: userId
      list: db01,db02
      db00:
        driver-class-name: com.mysql.cj.jdbc.Driver
        username: ${MYSQL_USER:root}
        password: ${MYSQL_PASS:123456}
        type-class-name: com.zaxxer.hikari.HikariDataSource
        pool:
          pool-name: Retail_HikariCP
          minimum-idle: 5
          idle-timeout: 180000
          maximum-pool-size: 10
          auto-commit: true
          max-lifetime: 1800000
          connection-timeout: 30000
          connection-test-query: SELECT 1
      db01:
        driver-class-name: com.mysql.cj.jdbc.Driver
        username: ${MYSQL_USER:root}
        password: ${MYSQL_PASS:123456}
        type-class-name: com.zaxxer.hikari.HikariDataSource
        pool:
          pool-name: Retail_HikariCP
          minimum-idle: 5
          idle-timeout: 180000
          maximum-pool-size: 10
          auto-commit: true
          max-lifetime: 1800000
          connection-timeout: 30000
          connection-test-query: SELECT 1
      db02:
        driver-class-name: com.mysql.cj.jdbc.Driver
        username: ${MYSQL_USER:root}
        password: ${MYSQL_PASS:123456}
        type-class-name: com.zaxxer.hikari.HikariDataSource
        pool:
          pool-name: Retail_HikariCP
          minimum-idle: 5
          idle-timeout: 180000
          maximum-pool-size: 10
          auto-commit: true
          max-lifetime: 1800000
          connection-timeout: 30000
          connection-test-query: SELECT 1

mybatis:
  mapper-locations: classpath:/mybatis/mapper/mysql/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

redis:
  sdk:
    config:
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

dubbo:
  application:
    name: big-market
    version: 1.0
  protocol:
    name: dubbo
    port: -1
  scan:
    base-packages: com.dyx.market.trigger

zookeeper:
  sdk:
    config:
      enable: false
      base-sleep-time-ms: 1000
      max-retries: 3
      session-timeout-ms: 18000
      connection-timeout-ms: 30000

xxl:
  job:
    accessToken: ${XXL_JOB_TOKEN:default_token}
    executor:
      address:
      appname: big-market-job
      ip:
      port: 9999
      logpath: ./data/applogs/xxl-job/jobhandler
      logretentiondays: 30

gateway:
  config:
    enable: true
    big-market-appId: ${GATEWAY_APP_ID:big-market}
    big-market-appToken: ${GATEWAY_APP_TOKEN:6ec604541f8b1ce4a}

account:
  service:
    remote-read:
      enabled: ${ACCOUNT_SERVICE_REMOTE_READ_ENABLED:false}
    remote-credit-write:
      enabled: ${ACCOUNT_SERVICE_REMOTE_CREDIT_WRITE_ENABLED:false}
    remote-quota-write:
      enabled: ${ACCOUNT_SERVICE_REMOTE_QUOTA_WRITE_ENABLED:false}
    remote-quota-decrement:
      enabled: ${ACCOUNT_SERVICE_REMOTE_QUOTA_DECREMENT_ENABLED:false}

strategy:
  embedded-rpc-provider:
    enabled: ${STRATEGY_EMBEDDED_RPC_PROVIDER_ENABLED:true}
  service:
    remote-read:
      enabled: ${STRATEGY_SERVICE_REMOTE_READ_ENABLED:false}

activity:
  embedded-rpc-provider:
    enabled: ${ACTIVITY_EMBEDDED_RPC_PROVIDER_ENABLED:true}

erp:
  embedded-rpc-provider:
    enabled: ${ERP_EMBEDDED_RPC_PROVIDER_ENABLED:true}

rebate:
  embedded-rpc-provider:
    enabled: ${REBATE_EMBEDDED_RPC_PROVIDER_ENABLED:true}
  service:
    remote-create-order:
      enabled: ${REBATE_SERVICE_REMOTE_CREATE_ORDER_ENABLED:false}
      app-id: ${REBATE_SERVICE_REMOTE_CREATE_ORDER_APP_ID:chatgpt-data}
    remote-read:
      enabled: ${REBATE_SERVICE_REMOTE_READ_ENABLED:false}
      app-id: ${REBATE_SERVICE_REMOTE_READ_APP_ID:chatgpt-data}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true
  prometheus:
    enabled: true

logging:
  level:
    root: info
    com.dyx.market: info
  config: classpath:logback-spring.xml
