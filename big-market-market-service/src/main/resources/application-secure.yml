# Secure profile: enable with SPRING_PROFILES_ACTIVE=docker,secure
# secure takes precedence over docker for DefaultCredentialGuard.
app:
  internal-rpc:
    enforce: true
    token: ${APP_INTERNAL_RPC_TOKEN}
  jwt:
    secret: ${JWT_SECRET}
  admin:
    token: ${ADMIN_TOKEN}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173}

chat:
  internal-service-token: ${CHAT_INTERNAL_SERVICE_TOKEN}
