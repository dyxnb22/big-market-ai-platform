# secure Profile：通过 SPRING_PROFILES_ACTIVE=docker,secure 启用。
# 对 DefaultCredentialGuard 而言，secure 的配置优先于 docker。
app:
  internal-rpc:
    enforce: true
    token: ${APP_INTERNAL_RPC_TOKEN}
  jwt:
    secret: ${JWT_SECRET}
  admin:
    token: ${ADMIN_TOKEN}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173}

chat:
  internal-service-token: ${CHAT_INTERNAL_SERVICE_TOKEN}
