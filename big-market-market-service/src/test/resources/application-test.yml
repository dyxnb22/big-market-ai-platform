spring:
  main:
    lazy-initialization: true
  cloud:
    inetutils:
      preferred-networks: 127.0.0.1
      use-only-site-local-interfaces: true
    client:
      hostname: localhost
      ip-address: 127.0.0.1
  rabbitmq:
    addresses: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    listener:
      simple:
        auto-startup: false
  elasticsearch.datasource:
    url: jdbc:es://http://${ELASTICSEARCH_HOST:127.0.0.1}:${ELASTICSEARCH_PORT:9200}

logging:
  file:
    path: target/test-logs

mini-db-router:
  jdbc:
    datasource:
      db00:
        url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/big_market?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      db01:
        url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/big_market_01?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      db02:
        url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/big_market_02?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true

redis:
  sdk:
    config:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}

# 保持注册中心地址符合 Dubbo 3.0.9 的要求。
# 不要将 metadata-report.address 设置为 N/A（会破坏 ApplicationConfig）。
# 不要设置会导致 ApplicationConfig 创建失败的 metadata-type/local 覆盖项。
dubbo:
  registry:
    # Context 测试不能将本机 Provider 注册到 Docker 使用的共享 Nacos。
    # Context 测试只验证 Bean 装配，不应订阅共享 Nacos 中的 Provider。
    register: false
    subscribe: false
    check: false
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://127.0.0.1:8848}
    # 不关闭以下能力时，Dubbo 会把注册中心同时初始化为配置/元数据中心，
    # 导致 Context 测试离线运行时仍要求可访问 Nacos。
    use-as-config-center: false
    use-as-metadata-center: false
  consumer:
    check: false
  application:
    qos-enable: false
    register-consumer: false
  metadata-report:
    report-metadata: false
    report-definition: false

nacos:
  config:
    sync:
      enabled: false

default-credential-guard:
  enabled: false

outbox-schema-guard:
  enabled: false

xxl:
  job:
    admin:
      addresses: http://${XXL_JOB_HOST:127.0.0.1}:${XXL_JOB_PORT:9090}/xxl-job-admin

gateway:
  config:
    enable: true
    apiHost: http://127.0.0.1:8080
