# 应用栈的安全配置覆盖层。
# 用法：
#   export JWT_SECRET=... APP_INTERNAL_RPC_TOKEN=... ADMIN_TOKEN=... \
#          CHAT_INTERNAL_SERVICE_TOKEN=... XXL_JOB_TOKEN=... APP_AUTH_DEV_USERS=...
#   docker compose -f docker-compose.yml -f docker-compose.secure.yml up --build -d
#
# 必须提供非默认密钥；当 SPRING_PROFILES_ACTIVE 包含 "secure" 时，
# DefaultCredentialGuard 会拒绝已知的默认凭据。

x-secure-env: &secure-env
  SPRING_PROFILES_ACTIVE: docker,secure
  APP_INTERNAL_RPC_TOKEN: ${APP_INTERNAL_RPC_TOKEN:?APP_INTERNAL_RPC_TOKEN is required for secure compose}
  APP_INTERNAL_RPC_ENFORCE: "true"
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required for secure compose}
  ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required for secure compose}
  CHAT_INTERNAL_SERVICE_TOKEN: ${CHAT_INTERNAL_SERVICE_TOKEN:?CHAT_INTERNAL_SERVICE_TOKEN is required for secure compose}
  XXL_JOB_TOKEN: ${XXL_JOB_TOKEN:?XXL_JOB_TOKEN is required for secure compose}
  MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required for secure compose}
  MYSQL_PASS: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required for secure compose}
  # Nacos 与 admin 侧 JDBC 确认必须使用同一组数据库凭据。
  NACOS_CONFIG_CONFIRM_JDBC_USER: ${MYSQL_USER:?MYSQL_USER is required for secure Nacos confirmation}
  NACOS_CONFIG_CONFIRM_JDBC_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required for secure Nacos confirmation}
  RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required for secure compose}
  RABBITMQ_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS is required for secure compose}
  APP_AUTH_DEV_USERS: ${APP_AUTH_DEV_USERS:?APP_AUTH_DEV_USERS is required for secure compose}
  APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5173}
  CROSS_ORIGIN: ${APP_CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5173}
  GATEWAY_RATE_LIMITER_ENABLED: "true"

services:
  big-market-auth-service:
    environment:
      <<: *secure-env
  big-market-admin-service:
    environment:
      <<: *secure-env
  big-market-chatbot-service:
    environment:
      <<: *secure-env
  big-market-market-service:
    environment:
      <<: *secure-env
  big-market-message-job-service:
    environment:
      <<: *secure-env
  big-market-account-service:
    environment:
      <<: *secure-env
  big-market-gateway:
    environment:
      <<: *secure-env
      GATEWAY_RATE_LIMITER_ENABLED: "true"
