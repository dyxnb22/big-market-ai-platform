name: SBOM (optional)

on:
  workflow_dispatch:

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked || cargo install cargo-cyclonedx
      - name: Generate SBOM
        working-directory: big-market-rs
        run: cargo cyclonedx -f json --all || true
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: big-market-rs/**/*.cdx.json
          if-no-files-found: warn
