name: rust

on:
  push:
    paths:
      - "big-market-rs/**"
      - "scripts/*rust*"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "big-market-rs/**"
      - "scripts/*rust*"
      - ".github/workflows/rust.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: big-market-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - name: API smoke
        working-directory: ${{ github.workspace }}
        run: ./scripts/smoke-rust-api.sh

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Rust binaries
        working-directory: big-market-rs
        run: cargo build --release -p bm-app -p bm-gateway
      - name: Playwright E2E (Rust)
        run: ./scripts/acceptance-rust-e2e.sh
