name: rust

on:
  push:
    paths:
      - "big-market-rs/**"
      - "scripts/*rust*"
      - "scripts/acceptance-dual-stack.sh"
      - "scripts/smoke-rust-mysql.sh"
      - "docs/dev-ops/mysql/sql/z-reconcile-tables.sql"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "big-market-rs/**"
      - "scripts/*rust*"
      - "scripts/acceptance-dual-stack.sh"
      - "scripts/smoke-rust-mysql.sh"
      - "docs/dev-ops/mysql/sql/z-reconcile-tables.sql"
      - ".github/workflows/rust.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: big-market-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - name: API smoke
        working-directory: ${{ github.workspace }}
        run: ./scripts/smoke-rust-api.sh

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Rust binaries
        working-directory: big-market-rs
        run: cargo build --release -p bm-app -p bm-gateway
      - name: Playwright E2E (Rust)
        run: ./scripts/acceptance-rust-e2e.sh

  mysql-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Start MySQL (dev init SQL)
        run: |
          docker compose -f docs/dev-ops/docker-compose-environment.yml up -d mysql
          for i in $(seq 1 60); do
            if docker exec mysql mysqladmin ping -h localhost -uroot -p123456 --silent 2>/dev/null; then
              break
            fi
            sleep 2
          done
          docker exec mysql mysqladmin ping -h localhost -uroot -p123456
      - name: Build Rust binaries
        working-directory: big-market-rs
        run: cargo build --release -p bm-app -p bm-gateway
      - name: MySQL backend smoke
        run: ./scripts/smoke-rust-mysql.sh
