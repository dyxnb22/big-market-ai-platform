name: Build and Verify

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Maven verify
        run: mvn -B verify -DfailIfNoTests=false
      - name: Mapper and DDL gates
        run: ./scripts/validate-mapper-ddl-gates.sh
