app:
  internal-rpc:
    token: ${APP_INTERNAL_RPC_TOKEN:big-market-internal-dev}
    enforce: ${APP_INTERNAL_RPC_ENFORCE:false}

spring:
  profiles:
    active: dev
  application:
    name: big-market-message-job-service
  rabbitmq:
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASS:admin}
    listener:
      simple:
        prefetch: 1
        default-requeue-rejected: false
    topic:
      activity_sku_stock_zero: activity_sku_stock_zero
      send_award: send_award
      send_rebate: send_rebate
      credit_adjust_success: credit_adjust_success
  elasticsearch.datasource:
    driverClassName: org.elasticsearch.xpack.sql.jdbc.EsDriver
  cloud:
    zookeeper:
      enabled: false

server:
  port: ${SERVER_PORT:8085}

dubbo:
  application:
    name: big-market-message-job
    version: 1.0
  registry:
    check: false
  protocol:
    name: dubbo
    port: -1

thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

mini-db-router:
  jdbc:
    datasource:
      dbCount: 2
      tbCount: 4
      default: db00
      routerKey: userId
      list: db01,db02
      db00:
        driver-class-name: com.mysql.cj.jdbc.Driver
        username: ${MYSQL_USER:root}
        password: ${MYSQL_PASS:123456}
        type-class-name: com.zaxxer.hikari.HikariDataSource
        pool:
          pool-name: Retail_HikariCP
          minimum-idle: 5
          idle-timeout: 180000
          maximum-pool-size: 10
          auto-commit: true
          max-lifetime: 1800000
          connection-timeout: 30000
          connection-test-query: SELECT 1
      db01:
        driver-class-name: com.mysql.cj.jdbc.Driver
        username: ${MYSQL_USER:root}
        password: ${MYSQL_PASS:123456}
        type-class-name: com.zaxxer.hikari.HikariDataSource
        pool:
          pool-name: Retail_HikariCP
          minimum-idle: 5
          idle-timeout: 180000
          maximum-pool-size: 10
          auto-commit: true
          max-lifetime: 1800000
          connection-timeout: 30000
          connection-test-query: SELECT 1
      db02:
        driver-class-name: com.mysql.cj.jdbc.Driver
        username: ${MYSQL_USER:root}
        password: ${MYSQL_PASS:123456}
        type-class-name: com.zaxxer.hikari.HikariDataSource
        pool:
          pool-name: Retail_HikariCP
          minimum-idle: 5
          idle-timeout: 180000
          maximum-pool-size: 10
          auto-commit: true
          max-lifetime: 1800000
          connection-timeout: 30000
          connection-test-query: SELECT 1

mybatis:
  mapper-locations: classpath:/mybatis/mapper/mysql/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

redis:
  sdk:
    config:
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

xxl:
  job:
    accessToken: ${XXL_JOB_TOKEN:default_token}
    executor:
      address:
      appname: big-market-message-job
      ip:
      port: 9998
      logpath: ./data/applogs/xxl-job/jobhandler
      logretentiondays: 30

gateway:
  config:
    enable: true
    big-market-appId: ${GATEWAY_APP_ID:big-market}
    big-market-appToken: ${GATEWAY_APP_TOKEN:6ec604541f8b1ce4a}

account:
  fulfillment:
    remote-award:
      enabled: ${ACCOUNT_FULFILLMENT_REMOTE_AWARD_ENABLED:false}
  service:
    remote-credit-write:
      enabled: ${ACCOUNT_SERVICE_REMOTE_CREDIT_WRITE_ENABLED:false}
    remote-quota-write:
      enabled: ${ACCOUNT_SERVICE_REMOTE_QUOTA_WRITE_ENABLED:false}
  award-credit-outbox:
    enabled: ${ACCOUNT_AWARD_CREDIT_OUTBOX_ENABLED:false}

job:
  shared-task-dispatch:
    credit-award-disabled: ${JOB_SHARED_TASK_DISPATCH_CREDIT_AWARD_DISABLED:false}
  credit-pay-delivery:
    max-retries: ${JOB_CREDIT_PAY_DELIVERY_MAX_RETRIES:5}
    scan-limit: ${JOB_CREDIT_PAY_DELIVERY_SCAN_LIMIT:20}
    min-stuck-minutes: ${JOB_CREDIT_PAY_DELIVERY_MIN_STUCK_MINUTES:1}
    restore-sku-stock: ${JOB_CREDIT_PAY_DELIVERY_RESTORE_SKU_STOCK:true}
  dlq-replay:
    max-retries: ${JOB_DLQ_REPLAY_MAX_RETRIES:5}
    max-consume-failures: ${JOB_DLQ_REPLAY_MAX_CONSUME_FAILURES:5}
    scan-limit: ${JOB_DLQ_REPLAY_SCAN_LIMIT:50}
  remote-write-reconcile:
    enabled: ${JOB_REMOTE_WRITE_RECONCILE_ENABLED:true}
    max-retries: ${JOB_REMOTE_WRITE_RECONCILE_MAX_RETRIES:5}
    scan-limit: ${JOB_REMOTE_WRITE_RECONCILE_SCAN_LIMIT:50}
  chat-refund-reconcile:
    max-retries: ${JOB_CHAT_REFUND_RECONCILE_MAX_RETRIES:5}
    scan-limit: ${JOB_CHAT_REFUND_RECONCILE_SCAN_LIMIT:50}
  strategy-stock-confirm:
    scan-limit: ${JOB_STRATEGY_STOCK_CONFIRM_SCAN_LIMIT:20}
    processing-lease-minutes: ${JOB_STRATEGY_STOCK_CONFIRM_PROCESSING_LEASE_MINUTES:5}

outbox-schema-guard:
  enabled: ${OUTBOX_SCHEMA_GUARD_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true
  prometheus:
    enabled: true

logging:
  level:
    root: info
    com.dyx.market: info
  config: classpath:logback-spring.xml
