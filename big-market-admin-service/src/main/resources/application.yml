server:
  port: ${SERVER_PORT:8082}

app:
  config:
    api-version: ${API_VERSION:v1}
    cross-origin: ${CROSS_ORIGIN:'*'}
  jwt:
    secret: ${JWT_SECRET:change-me-in-dev-only}
  admin:
    token: ${ADMIN_TOKEN:admin-dev-token}
    user-ids: ${ADMIN_USER_IDS:admin}

token-revocation:
  redis:
    enabled: ${TOKEN_REVOCATION_REDIS_ENABLED:false}

redis:
  sdk:
    config:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

nacos:
  config:
    sync:
      enabled: true
      serverAddr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
      dataId: big-market-platform-config
      group: DEFAULT_GROUP
      namespace: ""

logging:
  level:
    root: info
    com.dyx.market: info
    com.alibaba.nacos: warn
  config: classpath:logback-spring.xml
