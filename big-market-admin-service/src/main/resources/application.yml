server:
  port: ${SERVER_PORT:8082}

app:
  config:
    api-version: ${API_VERSION:v1}
    cross-origin: ${CROSS_ORIGIN:'*'}
  jwt:
    secret: ${JWT_SECRET:change-me-in-dev-only}
  admin:
    token: ${ADMIN_TOKEN:admin-dev-token}
    user-ids: ${ADMIN_USER_IDS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

nacos:
  config:
    sync:
      enabled: true
      serverAddr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
      dataId: big-market-platform-config
      group: DEFAULT_GROUP
      namespace: ""

logging:
  level:
    root: info
    com.dyx.market: info
    com.alibaba.nacos: warn
  config: classpath:logback-spring.xml
