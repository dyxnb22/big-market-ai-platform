spring:
  profiles:
    active: dev

server:
  port: ${SERVER_PORT:8082}

app:
  config:
    api-version: ${API_VERSION:v1}
    cross-origin: ${CROSS_ORIGIN:'*'}
  jwt:
    secret: ${JWT_SECRET:change-me-in-dev-only}
  admin:
    token: ${ADMIN_TOKEN:admin-dev-token}
    user-ids: ${ADMIN_USER_IDS:admin}

redis:
  sdk:
    config:
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

nacos:
  config:
    sync:
      enabled: true
      dataId: big-market-platform-config
      group: DEFAULT_GROUP
      runtimeDataId: big-market-runtime-switches
      runtimeGroup: DEFAULT_GROUP
      namespace: public

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: info
    com.dyx.market: info
    com.alibaba.nacos: warn
  config: classpath:logback-spring.xml
