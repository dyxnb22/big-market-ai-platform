# Docker Compose: infra containers on the dev-ops network.
token-revocation:
  redis:
    enabled: ${TOKEN_REVOCATION_REDIS_ENABLED:true}

redis:
  sdk:
    config:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

nacos:
  config:
    sync:
      enabled: ${NACOS_CONFIG_SYNC_ENABLED:true}
      serverAddr: ${NACOS_HOST:nacos}:${NACOS_PORT:8848}
      dataId: ${NACOS_CONFIG_DATA_ID:big-market-platform-config}
      group: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
      runtimeDataId: ${NACOS_RUNTIME_DATA_ID:big-market-runtime-switches}
      runtimeGroup: ${NACOS_RUNTIME_GROUP:DEFAULT_GROUP}
      namespace: ${NACOS_CONFIG_NAMESPACE:public}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      confirmJdbcUrl: ${NACOS_CONFIG_CONFIRM_JDBC_URL:jdbc:mysql://mysql:3306/nacos_config?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
      confirmJdbcUser: ${NACOS_CONFIG_CONFIRM_JDBC_USER:root}
      confirmJdbcPassword: ${NACOS_CONFIG_CONFIRM_JDBC_PASSWORD:123456}

gateway:
  config:
    apiHost: http://${GATEWAY_API_HOST:big-market-gateway}:8080
