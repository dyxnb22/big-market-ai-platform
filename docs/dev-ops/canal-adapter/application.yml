server:
  port: 8081
spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

canal.conf:
  mode: tcp # 可选传输模式：tcp、kafka、rocketMQ、rabbitMQ
  flatMessage: true
  syncBatchSize: 1000
  retries: -1
  timeout:
  accessKey:
  secretKey:
  consumerProperties:
    canal.tcp.server.host: canal-server:11111
    canal.tcp.batch.size: 500
    canal.tcp.username:
    canal.tcp.password:

  # 需要同步的数据库配置
  srcDataSources:
    big_market_01:
      url: jdbc:mysql://mysql:3306/big_market_01?useUnicode=true
      username: canal
      password: canal
    big_market_02:
      url: jdbc:mysql://mysql:3306/big_market_02?useUnicode=true
      username: canal
      password: canal
  canalAdapters:
  - instance: example # Canal 实例名或 MQ Topic 名
    groups:
    - groupId: g1
      outerAdapters:
      - name: logger
      - name: es7
        hosts: elasticsearch:9200 # REST 模式下可使用 127.0.0.1:9200
        properties:
          mode: rest # 可选模式：transport 或 rest
          cluster.name: docker-cluster
