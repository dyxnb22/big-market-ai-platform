global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'big-market'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'bm-gateway:8080'
          - 'bm-app:8083'
          - 'bm-worker:8085'
        labels:
          app: 'big-market'
