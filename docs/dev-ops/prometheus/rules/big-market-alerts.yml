groups:
  - name: big-market-business
    rules:
      - alert: PendingRemoteWriteBacklog
        expr: sum(big_market_pending_remote_write_tasks) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "pending_remote_write_task backlog high"
          description: "Remote write pending+continuation count is {{ $value }} for >5m"

      - alert: MqDeadLetterPending
        expr: big_market_mq_dead_letter_pending > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "mq_dead_letter has pending rows"
          description: "DLQ pending count is {{ $value }} for >10m"

      - alert: ChatRefundPending
        expr: big_market_chat_refund_pending > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "chat credit refund backlog"
          description: "chat_credit_session refund_state=pending count is {{ $value }} for >10m"

      - alert: StrategyStockConfirmPending
        expr: big_market_strategy_stock_confirm_pending > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "strategy award stock confirm backlog"
          description: "strategy_award_stock_confirm_task pending count is {{ $value }} for >5m"

      - alert: RemoteWriteFailed
        expr: big_market_remote_write_failed > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "remote write tasks exhausted retries"
          description: "Manual replay is required for {{ $value }} failed remote-write task(s)"

      - alert: CreditAwardFailed
        expr: big_market_credit_award_failed > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "credit award outbox tasks failed"
          description: "Inspect and replay failed credit award tasks: {{ $value }}"

      - alert: StrategyStockConfirmManualPending
        expr: big_market_strategy_stock_confirm_manual_pending > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "strategy stock confirmation needs manual review"
          description: "{{ $value }} stock confirmation task(s) reached manual_pending"

      - alert: ChatDeducting
        expr: big_market_chat_deducting > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "chat debit reconciliation backlog"
          description: "{{ $value }} chat session(s) remain deducting"
