version: '3.8'
# docker-compose -f docs/dev-ops/docker-compose-app.yml up -d
services:
  big-market-app:
    image: big-market-app:latest
    container_name: big-market-app
    restart: always
    ports:
      - "8091:8091"
    environment:
      - TZ=Asia/Shanghai
      - SERVER_PORT=8091
      - APP_CONFIG_API_VERSION=v1
      - APP_CONFIG_CROSS_ORIGIN=*
      - APP_JWT_SECRET=${JWT_SECRET:-change-me-in-prod}
      - APP_ADMIN_TOKEN=${ADMIN_TOKEN:-admin-token}
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/big_market?serverTimezone=UTC&characterEncoding=utf8&autoReconnect=true&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_HIKARI_POOL_NAME=Retail_HikariCP
      - REDIS_SDK_CONFIG_HOST=redis
      - REDIS_SDK_CONFIG_PORT=6379
      - SPRING_RABBITMQ_ADDRESSES=rabbitmq
      - SPRING_APPLICATION_JSON={"dubbo":{"registry":{"address":"nacos://nacos:8848"}}}
      - CHATBOT_PROVIDER=${CHATBOT_PROVIDER:-local}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
    volumes:
      - ./log:/data/log
    networks:
      - my-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  big-market-front-app:
    container_name: big-market-front-app
    image: big-market-front-app:latest
    restart: always
    networks:
      - my-network
    ports:
      - "3000:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  my-network:
    external: true
    name: dev-ops_my-network
