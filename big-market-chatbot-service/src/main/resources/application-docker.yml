# Docker Compose.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

chatbot:
  gateway-url: ${CHATBOT_GATEWAY_URL:http://big-market-gateway:8080}

chat:
  internal-service-token: ${CHAT_INTERNAL_SERVICE_TOKEN:change-me-chat-internal-docker}

redis:
  sdk:
    config:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

mini-db-router:
  jdbc:
    datasource:
      db01:
        url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/big_market_01?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true

nacos:
  config:
    sync:
      enabled: ${NACOS_CONFIG_SYNC_ENABLED:true}
      serverAddr: ${NACOS_HOST:nacos}:${NACOS_PORT:8848}
      dataId: ${NACOS_CONFIG_DATA_ID:big-market-platform-config}
      group: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
      runtimeDataId: ${NACOS_RUNTIME_DATA_ID:big-market-runtime-switches}
      runtimeGroup: ${NACOS_RUNTIME_GROUP:DEFAULT_GROUP}
      namespace: ${NACOS_CONFIG_NAMESPACE:}
      fail-open: ${NACOS_CONFIG_SYNC_FAIL_OPEN:false}

management:
  health:
    rabbit:
      enabled: false
