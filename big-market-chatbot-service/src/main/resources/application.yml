spring:
  profiles:
    active: dev

server:
  port: ${SERVER_PORT:8084}

app:
  config:
    api-version: ${API_VERSION:v1}
    cross-origin: ${CROSS_ORIGIN:'*'}
  jwt:
    secret: ${JWT_SECRET:${APP_JWT_SECRET:change-me-in-docker-dev-only}}

chatbot:
  provider: ${CHATBOT_PROVIDER:local}
  cost-per-ask: ${CHATBOT_COST_PER_ASK:1}
  gateway-url: ${CHATBOT_GATEWAY_URL:http://127.0.0.1:8080}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}

mini-db-router:
  jdbc:
    datasource:
      dbCount: 1
      tbCount: 1
      default: db01
      routerKey: userId
      list: db01
      db01:
        driver-class-name: com.mysql.cj.jdbc.Driver
        username: ${MYSQL_USER:root}
        password: ${MYSQL_PASS:123456}
        url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/big_market_01?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        type-class-name: com.zaxxer.hikari.HikariDataSource
        pool:
          pool-name: Chatbot_HikariCP
          minimum-idle: 2
          maximum-pool-size: 5
          auto-commit: true
          connection-timeout: 30000
          connection-test-query: SELECT 1

mybatis:
  mapper-locations: classpath:/mybatis/mapper/mysql/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

nacos:
  config:
    sync:
      enabled: true
      dataId: big-market-platform-config
      group: DEFAULT_GROUP
      namespace: ""

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true
  prometheus:
    enabled: true

logging:
  level:
    root: info
    com.dyx.market: info
    com.alibaba.nacos: warn
  config: classpath:logback-spring.xml
