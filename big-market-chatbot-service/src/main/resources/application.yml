server:
  port: ${SERVER_PORT:8084}

app:
  config:
    api-version: ${API_VERSION:v1}
    cross-origin: ${CROSS_ORIGIN:'*'}

chatbot:
  provider: ${CHATBOT_PROVIDER:local}
  cost-per-ask: ${CHATBOT_COST_PER_ASK:1}
  gateway-url: ${CHATBOT_GATEWAY_URL:http://big-market-gateway:8080}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

nacos:
  config:
    sync:
      enabled: true
      serverAddr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
      dataId: big-market-platform-config
      group: DEFAULT_GROUP
      namespace: ""

logging:
  level:
    root: info
    com.dyx.market: info
    com.alibaba.nacos: warn
  config: classpath:logback-spring.xml
