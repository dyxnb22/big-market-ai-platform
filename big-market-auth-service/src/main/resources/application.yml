spring:
  profiles:
    active: dev

server:
  port: ${SERVER_PORT:8081}

app:
  config:
    api-version: ${API_VERSION:v1}
    cross-origin: ${CROSS_ORIGIN:'*'}
  jwt:
    # DEV-ONLY default — overridden via JWT_SECRET env var /production.
    # The DefaultCredentialGuard will refuse to start in non-dev profiles if
    # this default is still in place.
    secret: ${JWT_SECRET:change-me-in-dev-only}
  auth:
    # DEV-ONLY credential seed for the demo frontend.
    # Override APP_AUTH_DEV_USERS in real deployments.
    # The DefaultCredentialGuard will refuse to start in non-dev profiles if
    # "admin:admin" or "xiaofuge:demo" are still present.
    dev-users: ${APP_AUTH_DEV_USERS:xiaofuge:demo,admin:admin}

# ── Default credential guard () ──
# Set DEFAULT_CREDENTIAL_GUARD_ENABLED=false only in dev environments.
default-credential-guard:
  enabled: ${DEFAULT_CREDENTIAL_GUARD_ENABLED:true}

redis:
  sdk:
    config:
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true
  prometheus:
    enabled: true

logging:
  level:
    root: info
    com.dyx.market: info
  config: classpath:logback-spring.xml
