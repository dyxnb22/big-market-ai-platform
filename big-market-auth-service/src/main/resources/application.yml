server:
  port: ${SERVER_PORT:8081}

app:
  config:
    api-version: ${API_VERSION:v1}
    cross-origin: ${CROSS_ORIGIN:'*'}
  jwt:
    secret: ${JWT_SECRET:change-me-in-dev-only}
  auth:
    # Local dev/test credential seed for the demo frontend only.
    # Override APP_AUTH_DEV_USERS in real deployments.
    dev-users: ${APP_AUTH_DEV_USERS:xiaofuge:demo,admin:admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: info
    com.dyx.market: info
  config: classpath:logback-spring.xml
