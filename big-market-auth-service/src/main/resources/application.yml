spring:
  profiles:
    active: dev

server:
  port: ${SERVER_PORT:8081}

app:
  config:
    api-version: ${API_VERSION:v1}
    cross-origin: ${CROSS_ORIGIN:'*'}
  jwt:
    # 仅供开发环境使用的默认值；生产环境通过 JWT_SECRET 环境变量覆盖。
    # 如果非开发 Profile 仍使用该默认值，DefaultCredentialGuard 将拒绝启动。
    secret: ${JWT_SECRET:change-me-in-dev-only}
  auth:
    # 演示前端专用的开发环境凭据种子。
    # 实际部署时通过 APP_AUTH_DEV_USERS 覆盖。
    # 如果非开发 Profile 仍包含 "admin:admin" 或 "xiaofuge:demo"，
    # DefaultCredentialGuard 将拒绝启动。
    dev-users: ${APP_AUTH_DEV_USERS:xiaofuge:demo,admin:admin}

# ── 默认凭据防护（DefaultCredentialGuard） ──
# 仅允许在开发环境将 DEFAULT_CREDENTIAL_GUARD_ENABLED=false。
default-credential-guard:
  enabled: ${DEFAULT_CREDENTIAL_GUARD_ENABLED:true}

redis:
  sdk:
    config:
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: info
    com.dyx.market: info
  config: classpath:logback-spring.xml
