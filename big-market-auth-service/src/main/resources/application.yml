server:
  port: ${SERVER_PORT:8081}

app:
  config:
    api-version: ${API_VERSION:v1}
    cross-origin: ${CROSS_ORIGIN:'*'}
  jwt:
    # DEV-ONLY default — overridden via JWT_SECRET env var in staging/production.
    # The DefaultCredentialGuard will refuse to start in non-dev profiles if
    # this default is still in place.
    secret: ${JWT_SECRET:change-me-in-dev-only}
  auth:
    # DEV-ONLY credential seed for the demo frontend.
    # Override APP_AUTH_DEV_USERS in real deployments.
    # The DefaultCredentialGuard will refuse to start in non-dev profiles if
    # "admin:admin" or "xiaofuge:demo" are still present.
    dev-users: ${APP_AUTH_DEV_USERS:xiaofuge:demo,admin:admin}

# ── Token revocation (Phase 8-B) ──
# In-memory by default. Set token-revocation.redis.enabled=true when
# RedissonClient is available for multi-instance consistency.
token-revocation:
  redis:
    enabled: ${TOKEN_REVOCATION_REDIS_ENABLED:false}

# ── Default credential guard (Phase 8-A) ──
# Set DEFAULT_CREDENTIAL_GUARD_ENABLED=false only in dev environments.
default-credential-guard:
  enabled: ${DEFAULT_CREDENTIAL_GUARD_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: info
    com.dyx.market: info
  config: classpath:logback-spring.xml
