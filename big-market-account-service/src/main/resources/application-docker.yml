# Docker Compose: infra containers on the dev-ops network.
spring:
  rabbitmq:
    addresses: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
  elasticsearch.datasource:
    url: jdbc:es://http://${ELASTICSEARCH_HOST:elasticsearch}:${ELASTICSEARCH_PORT:9200}

mini-db-router:
  jdbc:
    datasource:
      db00:
        url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/big_market?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      db01:
        url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/big_market_01?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      db02:
        url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/big_market_02?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true

redis:
  sdk:
    config:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

dubbo:
  registry:
    id: nacos-registry
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://nacos:8848}

gateway:
  config:
    apiHost: http://${GATEWAY_API_HOST:big-market-gateway}:8080
