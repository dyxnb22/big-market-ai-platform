<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理端登录 - Lucky Draw AI</title>
  <link rel="stylesheet" href="./styles.css?v=4" />
</head>
<body data-page="admin-login">
<div class="admin-login-page">
  <div class="admin-login-container">
    <div class="admin-logo-row">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" stroke="#6366f1" stroke-width="2"/><line x1="9" y1="3" x2="9" y2="21" stroke="#6366f1" stroke-width="2"/></svg>
      <span>运营管理端</span>
    </div>
    <h1>管理员登录</h1>
    <p class="admin-hint">请使用管理员账号登录以管理活动、奖品和 AI 配置。</p>

    <div class="field">
      <label for="adminUserIdInput">管理员 ID</label>
      <input id="adminUserIdInput" value="xiaofuge" autocomplete="username" placeholder="输入管理员ID" />
    </div>

    <div class="field">
      <label for="adminPasswordInput">密码</label>
      <input id="adminPasswordInput" type="password" value="demo" autocomplete="current-password" placeholder="输入密码" />
    </div>

    <button id="adminLoginBtn" class="submit-btn" type="button">登 录</button>

    <a class="back-link" href="./index.html">← 返回用户端</a>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="./config.js?v=4"></script>
<script src="./api-client.js?v=4"></script>
<script src="./admin-login.js?v=4"></script>
</body>
</html>
