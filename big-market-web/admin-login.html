<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理端登录 - Lucky Draw AI</title>
  <link rel="stylesheet" href="./styles.css?v=__APP_VERSION__" />
</head>
<body data-page="admin-login">
<div class="admin-login-page">
  <div class="admin-login-container">
    <div class="admin-logo-row">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" stroke="#6366f1" stroke-width="2"/><line x1="9" y1="3" x2="9" y2="21" stroke="#6366f1" stroke-width="2"/></svg>
      <span>运营管理端</span>
    </div>
    <h1>管理员登录</h1>
    <p class="admin-hint">请使用管理员账号登录以管理活动、奖品和 AI 配置。</p>

    <div class="field">
      <label for="adminUserIdInput">管理员 ID</label>
      <input id="adminUserIdInput" name="username" type="text" autocomplete="username" placeholder="输入管理员ID" />
    </div>

    <div class="field">
      <label for="adminPasswordInput">密码</label>
      <input id="adminPasswordInput" name="password" type="password" autocomplete="current-password" placeholder="输入密码" />
    </div>

    <button id="adminLoginBtn" class="submit-btn" type="button">登 录</button>

    <p class="admin-hint">演示管理员：admin / admin &nbsp;<button type="button" onclick="document.getElementById('adminUserIdInput').value='admin';document.getElementById('adminPasswordInput').value='admin';" style="font-size:11px;padding:2px 8px;border:1px solid #4b5563;border-radius:4px;background:transparent;cursor:pointer;color:inherit;">填入</button></p>
    <a class="back-link" href="./index.html">← 返回用户端</a>
  </div>
</div>

<output id="toast" class="toast" aria-live="polite"></output>
<script src="./config.js?v=__APP_VERSION__"></script>
<script src="./api-client.js?v=__APP_VERSION__"></script>
<script src="./login-common.js?v=__APP_VERSION__"></script>
<script src="./admin-login.js?v=__APP_VERSION__"></script>
</body>
</html>
