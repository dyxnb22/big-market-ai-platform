<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="登录 - Lucky Draw AI" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>登录 - Lucky Draw AI</title>
  <link rel="stylesheet" href="./styles.css?v=__APP_VERSION__" />
</head>
<body>
<div class="login-page">
  <div class="login-container">
    <div class="logo-row">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#4f46e5" stroke-width="2"/><path d="M12 2a2 2 0 0 1 2 2v16a2 2 0 0 1-4 0V4a2 2 0 0 1 2-2z" fill="#4f46e5"/></svg>
      <span>Lucky Draw AI</span>
    </div>
    <h1>登录你的账户</h1>

    <div class="field">
      <label for="userIdInput">用户 ID</label>
      <input id="userIdInput" name="username" type="text" autocomplete="username" placeholder="输入用户ID" />
    </div>

    <div class="field">
      <label for="passwordInput">密码</label>
      <input id="passwordInput" name="password" type="password" autocomplete="current-password" placeholder="输入密码" />
    </div>

    <button id="loginBtn" class="submit-btn" type="button">登 录</button>

    <p class="hint">演示账号：xiaofuge / demo &nbsp;<button type="button" onclick="document.getElementById('userIdInput').value='xiaofuge';document.getElementById('passwordInput').value='demo';" style="font-size:11px;padding:2px 8px;border:1px solid var(--line,#e5e7eb);border-radius:4px;background:transparent;cursor:pointer;color:inherit;">填入</button></p>
    <a class="back-link" href="./index.html">← 返回首页</a>
  </div>
</div>

<output id="toast" class="toast" aria-live="polite"></output>
<script src="./config.js?v=__APP_VERSION__"></script>
<script src="./api-client.js?v=__APP_VERSION__"></script>
<script src="./login-common.js?v=__APP_VERSION__"></script>
<script src="./login.js?v=__APP_VERSION__"></script>
</body>
</html>
