server {
    listen 80;
    server_name localhost;

    # 静态文件。
    root /usr/share/nginx/html;
    index index.html;
    etag off;

    # 浏览器侧纵深防御。由于学习前端是静态 legacy HTML，暂时允许内联处理器/样式；
    # 所有远程脚本源均已在 index.html 中通过 SRI 固定。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:8080 http://localhost:8080; img-src 'self' data:; font-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # API 代理到 gateway（所有微服务均位于 gateway:8080 之后）。
    location /api/ {
        proxy_pass http://big-market-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # gateway Actuator 健康检查。
    location /actuator/ {
        proxy_pass http://big-market-gateway:8080;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 入口页面永不缓存；JS/CSS URL 带构建版本并重新校验，普通刷新不会运行过期资源。
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # 默认路由。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
