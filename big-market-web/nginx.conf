server {
    listen 80;
    server_name localhost;

    # Static files
    root /usr/share/nginx/html;
    index index.html;
    etag off;

    # Browser-side defense-in-depth. Inline handlers/styles remain temporarily
    # allowed because the learning frontend is static legacy HTML; all remote
    # script sources are pinned with SRI in index.html.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:8080 http://localhost:8080; img-src 'self' data:; font-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # API proxy to gateway (all microservices behind gateway :8080)
    location /api/ {
        proxy_pass http://big-market-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Actuator health (gateway)
    location /actuator/ {
        proxy_pass http://big-market-gateway:8080;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Entry pages are never cached; JS/CSS URLs are build-versioned and
    # also revalidated so a normal refresh never runs an obsolete bundle.
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Default
    location / {
        try_files $uri $uri/ /index.html;
    }
}
